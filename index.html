<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>LowkeyMods Widget</title>
  <style>
    :root{--bg:#0e0e0f;--card:#121214;--muted:#bfb6ae;--accent:#c1272d;--accent-2:#e5dcc5}
    html,body{height:100%;margin:0;font-family:Inter,Arial,Helvetica,sans-serif;background:var(--bg);color:var(--accent-2)}
    .wrap{max-width:1100px;margin:20px auto;padding:18px}
    .header{display:flex;align-items:center;justify-content:space-between}
    h1{margin:0;font-size:20px}
    .subtitle{color:var(--muted);font-size:13px;margin-top:6px}
    .auth{display:flex;gap:8px;align-items:center}
    button{background:var(--accent);border:none;padding:8px 12px;border-radius:8px;color:#fff;font-weight:700;cursor:pointer}
    button.secondary{background:transparent;border:1px solid rgba(255,255,255,0.08);color:var(--accent-2);padding:6px 10px}
    .mini{display:flex;gap:10px;align-items:center}
    .content{margin-top:18px}
    .card{display:flex;gap:12px;align-items:center;padding:12px;background:rgba(255,255,255,0.02);border-radius:8px;border:1px solid rgba(255,255,255,0.02)}
    .prod{width:80px;height:60px;object-fit:cover;background:#222;border-radius:6px}
    .muted{color:var(--muted)}
    .row{display:flex;gap:8px}
    .remove{background:#7a1b1f}
    .link{color:var(--accent-2);text-decoration:none;padding:8px}
    a.tiny{color:var(--muted);font-size:13px;text-decoration:none}
    .empty{padding:40px;border-radius:8px;background:rgba(255,255,255,0.01);color:var(--muted)}
    .notice{padding:8px 10px;border-radius:6px;background:#1a1a1b;color:var(--muted);font-size:13px}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <div>
        <h1>Favorites • LowkeyMods</h1>
        <div class="subtitle" id="subtitle">Sign in to save favorites across the site</div>
      </div>
      <div class="auth" id="authArea"></div>
    </div>

    <div class="content" id="content">
      <!-- dynamic -->
    </div>

    <div style="margin-top:18px"><a class="tiny" href="#">Powered by LowkeyMods widget</a></div>
  </div>

  <!-- Firebase SDKs (modular) -->
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js';
    import { getAuth, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut } from 'https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js';
    import { getFirestore, collection, doc, setDoc, getDocs, query, orderBy, deleteDoc } from 'https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js';

    // ======= CONFIG =======
    const firebaseConfig = {
      apiKey: "AIzaSyBqDItP58Soa4A2rG98ZOLULEbHxB8XG1M",
      authDomain: "lowkeymods27.firebaseapp.com",
      projectId: "lowkeymods27",
      storageBucket: "lowkeymods27.firebasestorage.app",
      messagingSenderId: "814041484874",
      appId: "1:814041484874:web:867a38f37c394a2a72e0b3"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // UI refs
    const authArea = document.getElementById('authArea');
    const content = document.getElementById('content');
    const subtitleEl = document.getElementById('subtitle');

    // parse querystring
    const qAll = (()=>{const p=new URLSearchParams(location.search); const o={}; for(const [k,v] of p) o[k]=v; return o})();
    // pending product object from URL (id,title,price,img)
    let pendingProduct = null;
    if (qAll.id) {
      pendingProduct = { id: qAll.id, title: qAll.title || '', price: qAll.price || '', img: qAll.img || '' };
    }

    // escape
    function esc(s){return String(s||'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')}

    // ======= AUTH UI / RENDER =======
    function showSignIn(){renderSignForm(false)}
    function showSignUp(){renderSignForm(true)}

    function renderSignForm(isSignup){
      authArea.innerHTML='';
      const box = document.createElement('div');
      box.className='card';
      box.innerHTML = `
        <div style="display:flex;flex-direction:column;gap:8px;width:320px">
          <div style="font-weight:700">${isSignup? 'Create account' : 'Sign in'}</div>
          <input id="w_email" placeholder="email" style="padding:8px;border-radius:6px;background:#0e0e0f;border:1px solid rgba(255,255,255,0.04);color:var(--accent-2)" />
          <input id="w_pass" placeholder="password" type="password" style="padding:8px;border-radius:6px;background:#0e0e0f;border:1px solid rgba(255,255,255,0.04);color:var(--accent-2)" />
          <div style="display:flex;gap:8px;align-items:center">
            <button id="doAuth">${isSignup? 'Sign up' : 'Sign in'}</button>
            <button id="google" class="secondary">Google</button>
            <button id="cancel" class="secondary">Cancel</button>
          </div>
          <div id="authMsg" class="muted" style="font-size:13px"></div>
        </div>`;
      authArea.appendChild(box);
      document.getElementById('cancel').onclick = ()=>{authArea.innerHTML='';renderAuthUi(null)};
      document.getElementById('google').onclick = async ()=>{
        try{
          const provider = new GoogleAuthProvider();
          await signInWithPopup(auth, provider);
        }catch(e){console.error(e); document.getElementById('authMsg').textContent = e.message}
      };
      document.getElementById('doAuth').onclick = async ()=>{
        const email = document.getElementById('w_email').value.trim();
        const pass = document.getElementById('w_pass').value.trim();
        document.getElementById('authMsg').textContent = 'Please wait...';
        try{
          if (isSignup) {
            await createUserWithEmailAndPassword(auth, email, pass);
          } else {
            await signInWithEmailAndPassword(auth, email, pass);
          }
        }catch(err){console.error(err); document.getElementById('authMsg').textContent = err.message}
      };
    }

    async function addFavorite(uid, product){
      if(!uid || !product || !product.id) throw new Error('invalid');
      const ref = doc(db, 'users', uid, 'favorites', product.id);
      await setDoc(ref, { ...product, createdAt: new Date().toISOString() });
    }

    async function removeFavorite(uid, id){
      await deleteDoc(doc(db, 'users', uid, 'favorites', id));
    }

    async function renderContent(user){
      authArea.innerHTML='';
      content.innerHTML = '<div class="notice">Loading your favorites...</div>';

      try{
        if (!user) {
          // show preview when not signed in (if ?id provided)
          if (qAll.id) {
            content.innerHTML = `
              <div class="card">
                <img class="prod" src="${esc(qAll.img)}"/>
                <div>
                  <div style="font-weight:700">${esc(qAll.title)}</div>
                  <div class="muted">${esc(qAll.price)}</div>
                </div>
                <div style="margin-left:auto"><a class="link" href="${location.href}" onclick="">Open to add</a></div>
              </div>`;
          } else {
            content.innerHTML = '<div class="empty">You are not signed in. Add items from product pages to save them here.</div>';
          }
          return;
        }

        // query favorites
        const favCol = collection(db, 'users', user.uid, 'favorites');
        const q = query(favCol, orderBy('createdAt','desc'));
        const snap = await getDocs(q);
        if (snap.empty) {
          content.innerHTML = '<div class="empty">No favorites yet. Add products from the catalog.</div>';
          return;
        }
        content.innerHTML = '';
        snap.forEach(docSnap=>{
          const d = docSnap.data();
          const el = document.createElement('div'); el.className='card';
          el.innerHTML = `
            <img class="prod" src="${esc(d.img)}" />
            <div style="flex:1">
              <div style="font-weight:700">${esc(d.title)}</div>
              <div class="muted">${esc(d.price)}</div>
            </div>
            <div style="margin-left:auto;display:flex;gap:8px;align-items:center">
              <button class="remove" data-id="${docSnap.id}">Remove</button>
              <a class="link" href="https://www.instagram.com/lowkey._.mods" target="_blank">Order (DM)</a>
            </div>`;
          content.appendChild(el);
        });
        document.querySelectorAll('.remove').forEach(b=> b.onclick = async (ev)=>{
          const id = ev.currentTarget.dataset.id; await removeFavorite(user.uid, id); renderContent(user);
        });
      }catch(err){
        console.error('renderContent error', err);
        content.innerHTML = <div class="empty">Error loading favorites: ${esc(err.message||err)}</div>;
      }
    }

    // render auth / mini mode
    function renderAuthUi(user){
      authArea.innerHTML='';
      content.innerHTML='';
      // mini mode shows only sign in / sign up buttons
      if (qAll.mode === 'mini'){
        subtitleEl.textContent = 'Sign in to save favorites across the site';
        const wrap = document.createElement('div'); wrap.className='mini';
        const signIn = document.createElement('button'); signIn.textContent='Sign in'; signIn.onclick = showSignIn;
        const signUp = document.createElement('button'); signUp.textContent='Sign up'; signUp.className='secondary'; signUp.onclick = showSignUp;
        wrap.appendChild(signIn); wrap.appendChild(signUp);
        authArea.appendChild(wrap);
        // keep content empty
        return;
      }

      subtitleEl.textContent = 'Save products to view or order later';
      if (user){
        const btn = document.createElement('button'); btn.textContent='Sign out'; btn.onclick = ()=> signOut(auth);
        authArea.appendChild(btn);
        renderContent(user);
      } else {
        const signInBtn = document.createElement('button'); signInBtn.textContent='Sign in'; signInBtn.onclick = showSignIn;
        const signUpBtn = document.createElement('button'); signUpBtn.textContent='Sign up'; signUpBtn.className='secondary'; signUpBtn.onclick = showSignUp;
        authArea.appendChild(signInBtn); authArea.appendChild(signUpBtn);
        renderContent(null);
      }
    }

    // listen auth state
    onAuthStateChanged(auth, async (user)=>{
      try{
        renderAuthUi(user);
        // if user logged in and we have pending product, add it
        if (user && pendingProduct){
          try{
            await addFavorite(user.uid, pendingProduct);
            pendingProduct = null; // consumed
            // remove params from url
            history.replaceState(null,'', location.pathname + (qAll.mode ? ('?mode='+encodeURIComponent(qAll.mode)) : ''));
            renderContent(user);
          }catch(e){console.error('auto-add error', e)}
        }
      }catch(e){console.error(e)}
    });

    // auto-add when directly opened while signed in
    if (auth.currentUser && pendingProduct){
      addFavorite(auth.currentUser.uid, pendingProduct).then(()=> renderContent(auth.currentUser)).catch(e=>console.error(e));
    }

    // helper for escaping
    window.escapeHtml = esc;

  </script>
</body>
</html>
