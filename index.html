<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>LowkeyMods — Favorites</title>
  <style>
    :root{
      --bg:#0D0D0D;
      --accent:#C1272D;
      --muted:#6b6b6b;
      --text:#E5DCC5;
    }
    *{box-sizing:border-box;}
    body{
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      margin:0;
      background:var(--bg);
      color:var(--text);
    }
    .wrap{
      max-width:980px;
      margin:16px auto;
      padding:18px;
    }
    .header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:12px;
      gap:8px;
    }
    h2{margin:0;font-size:20px;}
    .muted{color:var(--muted);font-size:13px;}
    button{
      background:var(--accent);
      color:var(--text);
      border:none;
      padding:7px 11px;
      border-radius:8px;
      cursor:pointer;
      font-weight:600;
      font-size:13px;
      white-space:nowrap;
    }
    button.secondary{
      background:#222;
      color:var(--text);
    }
    input[type=email],input[type=password]{
      width:100%;
      padding:9px 10px;
      border-radius:8px;
      border:1px solid rgba(255,255,255,0.08);
      background:#141414;
      color:var(--text);
      font-size:14px;
    }
    input::placeholder{color:#555;}
    .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
    .auth-block{margin-bottom:12px;}
    .card{
      background:linear-gradient(180deg,rgba(255,255,255,0.03),rgba(255,255,255,0.01));
      border:1px solid rgba(255,255,255,0.06);
      padding:10px;
      border-radius:10px;
      margin-bottom:10px;
      display:flex;
      gap:10px;
      align-items:center;
    }
    img.prod{
      width:80px;
      height:60px;
      object-fit:cover;
      border-radius:6px;
      background:#111;
    }
    .center{display:flex;align-items:center;justify-content:center;text-align:center;}
    a.link{color:var(--accent);text-decoration:none;font-size:13px;}
    a.link:hover{text-decoration:underline;}
    .small{font-size:13px;}
    @media (max-width:600px){
      .wrap{padding:10px;}
      .header{flex-direction:column;align-items:flex-start;}
      .card{flex-direction:row;}
    }

    /* toast */
    #toast {
      position: fixed;
      bottom: 30px;
      right: 30px;
      background: #222;
      color: #fff;
      padding: 12px 20px;
      border-radius: 8px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
      font-size: 15px;
      z-index: 9999;
    }
    #toast.show { opacity: 1; pointer-events: auto; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <div>
        <h2>Favorites • LowkeyMods</h2>
        <div class="muted" id="subtitle">Save products to view or order later</div>
      </div>
      <div id="authArea"></div>
    </div>

    <div id="authForms"></div>
    <div id="content"></div>
    <div id="toast"></div>
  </div>

  <script type="module">
    // Firebase imports (v12.6.0)
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
    import {
      getAuth,
      onAuthStateChanged,
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      signOut
    } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";
    import {
      getFirestore,
      doc,
      collection,
      setDoc,
      deleteDoc,
      getDocs,
      query,
      orderBy,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";

    // ---- YOUR FIREBASE CONFIG ----
    const firebaseConfig = {
      apiKey: "AIzaSyBqDItP58Soa4A2rG98ZOLULEbHxB8XG1M",
      authDomain: "lowkeymods27.firebaseapp.com",
      projectId: "lowkeymods27",
      storageBucket: "lowkeymods27.firebasestorage.app",
      messagingSenderId: "814041484874",
      appId: "1:814041484874:web:867a38f37c394a2a72e0b3"
    };
    // ------------------------------

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const authArea   = document.getElementById('authArea');
    const authForms  = document.getElementById('authForms');
    const content    = document.getElementById('content');
    const subtitleEl = document.getElementById('subtitle');

    // simple toast
    function showToast(message, ms = 2000) {
      const t = document.getElementById("toast");
      t.textContent = message;
      t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), ms);
    }

    // -------- URL PARAMS / MODES --------
    function getQueryAll() {
      const p = new URLSearchParams(location.search);
      return {
        productId: p.get('id')    || '',
        title:     p.get('title') || '',
        price:     p.get('price') || '',
        img:       p.get('img')   || '',
        mode:      p.get('mode')  || ''
      };
    }
    const qAll = getQueryAll();

    // pending product for auto-add after login
    let pendingProduct = null;
    if (qAll.productId) {
      pendingProduct = {
        productId: qAll.productId,
        title:     qAll.title,
        price:     qAll.price,
        img:       qAll.img
      };
    }

    // ESCAPE HTML
    function escapeHtml(s){
      return (s||'').toString().replace(/[&<>"']/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
      }[c]));
    }

    // ---- AUTH UI RENDER ----
    function renderAuthUi(user) {
      authArea.innerHTML = '';
      authForms.innerHTML = '';

      // MINI MODE: compact login/signup for embedding on all pages
      if (qAll.mode === 'mini') {
        subtitleEl.textContent = 'Sign in to save favorites across the site';
        if (user) {
          authArea.innerHTML =
            `<div class="row">
              <div class="small">Signed in</div>
              <button id="outMini">Sign out</button>
            </div>`;
          document.getElementById('outMini').onclick = async () => { await signOut(auth); };
          // In mini mode we keep content empty (no favorites list here)
          content.innerHTML = '';
        } else {
          authArea.innerHTML =
            `<div class="row">
              <button id="miniSignIn">Sign in</button>
              <button id="miniSignUp" class="secondary">Sign up</button>
            </div>`;
          document.getElementById('miniSignIn').onclick = showSignIn;
          document.getElementById('miniSignUp').onclick = showSignUp;
          content.innerHTML = '';
        }
        return;
      }

      // FULL MODE: Favorites page
      subtitleEl.textContent = 'Save products to view or order later';
      if (user) {
        const btn = document.createElement('button');
        btn.textContent = 'Sign out';
        btn.onclick = async () => { await signOut(auth); };
        authArea.appendChild(btn);
        renderContent(user);
      } else {
        const signInBtn = document.createElement('button');
        signInBtn.textContent = 'Sign in';
        signInBtn.onclick = () => showSignIn();
        const signUpBtn = document.createElement('button');
        signUpBtn.textContent = 'Sign up';
        signUpBtn.classList.add('secondary');
        signUpBtn.onclick = () => showSignUp();
        authArea.appendChild(signInBtn);
        authArea.appendChild(signUpBtn);
        renderPreview(); // show product preview if called with ?id=...
      }
    }

    // ---- AUTH FORMS ----
    function showSignIn(){
      authForms.innerHTML = `
        <div class="auth-block">
          <input id="email" type="email" placeholder="Email" /><br/><br/>
          <input id="pw" type="password" placeholder="Password" /><br/><br/>
          <div class="row">
            <button id="doSignIn">Sign in</button>
            <span class="muted small">or <a class="link" id="gotoSignup">create an account</a></span>
          </div>
        </div>`;
      document.getElementById('doSignIn').onclick = async ()=>{
        const email = document.getElementById('email').value.trim();
        const pw    = document.getElementById('pw').value;
        try {
          await signInWithEmailAndPassword(auth, email, pw);
        } catch(e){
          showToast('Sign in error: '+(e.message || e));
        }
      };
      document.getElementById('gotoSignup').onclick = showSignUp;
    }

    function showSignUp(){
      authForms.innerHTML = `
        <div class="auth-block">
          <input id="s_email" type="email" placeholder="Email" /><br/><br/>
          <input id="s_pw" type="password" placeholder="Password (6+ chars)" /><br/><br/>
          <div class="row">
            <button id="doSignUp">Create account</button>
          </div>
        </div>`;
      document.getElementById('doSignUp').onclick = async ()=>{
        const email = document.getElementById('s_email').value.trim();
        const pw    = document.getElementById('s_pw').value;
        try {
          await createUserWithEmailAndPassword(auth, email, pw);
        } catch(e){
          showToast('Sign up error: '+(e.message || e));
        }
      };
    }

    // ---- PREVIEW MODE (when opened from product link) ----
    function renderPreview(){
      content.innerHTML = '';
      if (!qAll.productId) {
        content.innerHTML = `<div class="muted center" style="padding:20px;">
          Open a product from LowkeyMods and tap "Add to favorites".
        </div>`;
        return;
      }
      const c = document.createElement('div');
      c.className = 'card';
      c.innerHTML = `
        <img class="prod" src="${qAll.img || 'https://via.placeholder.com/300x200?text=Lowkey'}" />
        <div style="flex:1;">
          <div style="font-weight:700;font-size:14px;">${escapeHtml(qAll.title || 'Product')}</div>
          <div class="muted small" style="margin-top:2px;">${escapeHtml(qAll.price || '')}</div>
          <div style="margin-top:8px;"><button id="favNow">Add to favorites</button></div>
        </div>`;
      content.appendChild(c);
      const btn = document.getElementById('favNow');
      btn.onclick = async ()=>{
        if (!auth.currentUser) {
          showSignIn();
          return;
        }
        await addFavorite(auth.currentUser.uid, pendingProduct || qAll);
        showToast("Added to Favorites");
      };
    }

    // ---- FAVORITES LIST ----
    async function renderContent(user){
      if (qAll.mode === 'mini') return; // mini mode doesn't show full list here
      authForms.innerHTML = '';
      content.innerHTML = `<div class="muted center" style="padding:20px;">Loading your favorites...</div>`;

      try {
        const favCol = collection(db, 'users', user.uid, 'favorites');
        const q = query(favCol, orderBy('createdAt','desc'));
        const snap = await getDocs(q);
        content.innerHTML = '';
        if (snap.empty) {
          content.innerHTML = `<div class="muted center" style="padding:20px;">
            No favorites yet.<br/>Open a product and click "Add to favorites".
          </div>`;
          return;
        }
        snap.forEach(docSnap => {
          const data = docSnap.data();
          const item = document.createElement('div');
          item.className = 'card';
          item.innerHTML = `
            <img class="prod" src="${data.img || 'https://via.placeholder.com/300x200'}" />
            <div style="flex:1;">
              <div style="font-weight:700;font-size:14px;">${escapeHtml(data.title || '')}</div>
              <div class="muted small" style="margin-top:2px;">${escapeHtml(data.price || '')}</div>
              <div style="margin-top:8px;" class="row">
                <button class="remove" data-id="${docSnap.id}">Remove</button>
                <a class="link" href="https://www.instagram.com/lowkey._.mods" target="_blank">Order (DM)</a>
              </div>
            </div>`;
          content.appendChild(item);
        });
        document.querySelectorAll('.remove').forEach(btn=>{
          btn.onclick = async (ev)=>{
            const id = ev.target.dataset.id;
            await deleteDoc(doc(db, 'users', user.uid, 'favorites', id));
            renderContent(user);
          };
        });
      } catch(err) {
        console.error('renderContent error', err);
        content.innerHTML = `<div class="muted center" style="padding:20px;">Error loading favorites: ${escapeHtml(err.message || err)}</div>`;
      }
    }

    // ---- ADD FAVORITE ----
    async function addFavorite(uid, product){
      if (!product || !product.productId) return;
      const ref = doc(db, 'users', uid, 'favorites', product.productId);
      await setDoc(ref, {
        title: product.title || '',
        price: product.price || '',
        img:   product.img   || '',
        createdAt: serverTimestamp()
      });
    }

    // ---- AUTH STATE LISTENER + AUTO-ADD ----
    onAuthStateChanged(auth, async (user) => {
      renderAuthUi(user);

      // auto-add pending product after login/signup (full mode only)
      if (user && pendingProduct && qAll.mode !== 'mini') {
        try {
          await addFavorite(user.uid, pendingProduct);
          showToast('Product added to favorites');
          pendingProduct = null;
          // clean URL (remove product params, keep mode if present)
          const basePath = location.pathname + (qAll.mode ? ('?mode='+encodeURIComponent(qAll.mode)) : '');
          history.replaceState(null, '', basePath);
          renderContent(user);
        } catch (e) {
          console.error('Auto-add error', e);
        }
      }
    });
  </script>
</body>
</html>
